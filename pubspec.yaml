name: proj
description: Мой Страйкбол — mobile app (Flutter + Supabase).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.9.0
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  google_fonts: ^6.2.1
  flutter_dotenv: ^5.2.1
  intl: ^0.20.2
  image_picker: ^1.1.2
  flutter_image_compress: ^2.5.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.0
  record: ^6.2.1
  just_audio: ^0.10.6
  permission_handler: ^13.0.2
  path_provider: ^2.1.6
  path: ^1.9.1
  http: ^1.6.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  url_launcher: ^6.3.2
  cached_network_image: ^3.4.1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# 14.1.0 breaks release builds (kotlin compilerOptions without kotlin plugin).
dependency_overrides:
  permission_handler_android: 12.1.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#0B0F0A"
  adaptive_icon_foreground: assets/branding/app_icon.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - .env
